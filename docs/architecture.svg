<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" font-family="'PingFang SC','Microsoft YaHei','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#616161"/>
    </marker>
  </defs>

  <!-- Worker 进程外框 -->
  <rect x="30" y="30" width="400" height="240" rx="10" fill="#E3F2FD" stroke="#1976D2" stroke-width="2"/>
  <text x="230" y="66" font-size="20" font-weight="700" text-anchor="middle" fill="#0D47A1">SchedulerRun.py</text>
  <text x="230" y="91" font-size="14" text-anchor="middle" fill="#1565C0">(Worker 进程)</text>

  <!-- Worker 内框 -->
  <rect x="60" y="115" width="340" height="135" rx="8" fill="#FFFFFF" stroke="#1976D2" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="230" y="158" font-size="16" font-weight="600" text-anchor="middle" fill="#0D47A1">调度循环 + 任务执行</text>
  <text x="230" y="186" font-size="13" text-anchor="middle" fill="#546E7A">(Scheduler-Main)</text>
  <text x="230" y="220" font-size="14" text-anchor="middle" fill="#37474F">线程池并发执行</text>

  <!-- API 进程外框 -->
  <rect x="490" y="30" width="400" height="240" rx="10" fill="#E8F5E9" stroke="#388E3C" stroke-width="2"/>
  <text x="690" y="66" font-size="20" font-weight="700" text-anchor="middle" fill="#1B5E20">FastApiRun.py</text>
  <text x="690" y="91" font-size="14" text-anchor="middle" fill="#2E7D32">(API 进程)</text>

  <!-- API 内框 -->
  <rect x="520" y="115" width="340" height="135" rx="8" fill="#FFFFFF" stroke="#388E3C" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="690" y="158" font-size="16" font-weight="600" text-anchor="middle" fill="#1B5E20">Dashboard + REST API</text>
  <text x="690" y="186" font-size="13" text-anchor="middle" fill="#546E7A">(只读，不执行任务)</text>

  <!-- 连接线 -->
  <line x1="230" y1="270" x2="230" y2="310" stroke="#616161" stroke-width="2"/>
  <line x1="690" y1="270" x2="690" y2="310" stroke="#616161" stroke-width="2"/>
  <line x1="230" y1="310" x2="690" y2="310" stroke="#616161" stroke-width="2"/>
  <line x1="460" y1="310" x2="460" y2="363" stroke="#616161" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 共享存储后端标签 -->
  <rect x="392" y="299" width="136" height="22" fill="#FFFFFF"/>
  <text x="460" y="315" font-size="13" font-weight="600" text-anchor="middle" fill="#616161">共享存储后端</text>

  <!-- 数据库框 -->
  <rect x="310" y="365" width="300" height="110" rx="10" fill="#FFF3E0" stroke="#F57C00" stroke-width="2"/>
  <text x="460" y="406" font-size="18" font-weight="700" text-anchor="middle" fill="#E65100">MySQL / SQLite</text>
  <text x="460" y="436" font-size="13" text-anchor="middle" fill="#EF6C00">(SQLModel 后端)</text>
</svg>
